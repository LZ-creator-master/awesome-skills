name: 报告解释或来源错误
description: 提供具体位置、依据和建议修正，帮助我们核对案例。
title: '[内容核对] '
body:
  - type: input
    id: location
    attributes:
      label: 案例或技能链接
      placeholder: 请附页面地址和章节标题
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 哪句话或哪个数字有问题？
      description: 贴出必要的短句即可，不要上传私密论文或个人资料。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 核对依据与建议修正
      description: 原文链接、表号、公式编号或固定版本代码链接。
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 数字或引用
        - 方法解释
        - 页面或交互
        - 其他
